[package]
name = "paperloom"
version = "0.1.0"
description = "A local-first paper reader with synchronized PDF views"
authors = ["Paperloom contributors"]
edition = "2021"

[lib]
name = "paperloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

